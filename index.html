<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --theme-color: #FF9900;
    }
    .sidebar {
      background-color: #f8f8f8;
    }
    .markdown-section code {
      background-color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .markdown-section pre {
      background-color: #282c34;
    }
    .markdown-section pre code {
      background-color: transparent;
      color: #abb2bf;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section table th {
      background-color: #FF9900;
      color: white;
    }
    .app-name-link img {
      max-width: 50px;
    }
    /* GitBook 스타일 힌트 박스 */
    .markdown-section blockquote {
      border-left: 4px solid #FF9900;
      background-color: #fff8e6;
      padding: 12px 20px;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div id="app">로딩 중...</div>
  <script>
    window.$docsify = {
      name: '📘 EKS 온프레미스 가이드',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: '검색어를 입력하세요',
        noData: '결과가 없습니다',
        paths: 'auto'
      },
      copyCode: {
        buttonText: '복사',
        errorText: '오류',
        successText: '복사됨!'
      },
      pagination: {
        previousText: '이전',
        nextText: '다음',
        crossChapter: true
      },
      tabs: {
        persist: true,
        sync: true
      },
      auto2top: true,
      coverpage: false,
      onlyCover: false,
      notFoundPage: true,
    }

  <!-- Docsify 코어 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
